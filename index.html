    <style>
      /* Theme: Warm Paper & Botanicals variables */
      :root {
        /* Light theme (defaults) */
        --bg: #e7ded0;
        --paper: #fffaf4;
        --accent: #8a6a3b;
        --muted: #7a776f;
        --text: #1c2530; /* primary copy color */
        --text-muted: #64707a;
        --btn-bg-top: #f3ede3;
        --btn-bg-bottom: #eadfce;
        --btn-text: #2a313a;
        --btn-primary-top: #efe6d7;
        --btn-primary-bottom: #e6d9c6;
        --btn-primary-text: var(--text);
        --youtube-bg-top: rgba(238, 230, 217, 0.7);
        --youtube-bg-bottom: rgba(250, 246, 238, 0.7);
        --card-shadow: 0 20px 46px rgba(14, 20, 26, 0.18);
        --card-shadow-drop: drop-shadow(0 20px 40px rgba(14, 20, 26, 0.2));
        --card-border: rgba(32, 38, 46, 0.08);
        --grain-opacity: 0.45;
        --sheen: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.4),
          rgba(255, 255, 255, 0.08)
        );
        --ink-wash-1: rgba(26, 36, 48, 0.12);
        --ink-wash-2: rgba(138, 106, 59, 0.12);
        --ink-wash-3: rgba(20, 28, 36, 0.08);
        --ink-line: rgba(26, 36, 48, 0.2);
        --fiber-1: rgba(70, 62, 50, 0.08);
        --fiber-2: rgba(255, 255, 255, 0.35);
        --paper-edge: rgba(20, 24, 30, 0.12);
        --paper-speckle: rgba(80, 70, 55, 0.4);
        --paper-fiber: rgba(120, 110, 95, 0.3);
        --paper-band: rgba(80, 70, 55, 0.12);
        --paper-texture: url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27160%27%20height%3D%27160%27%3E%0A%20%20%3Cfilter%20id%3D%27n%27%3E%0A%20%20%20%20%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.9%27%20numOctaves%3D%272%27%20seed%3D%277%27/%3E%0A%20%20%20%20%3CfeColorMatrix%20type%3D%27matrix%27%20values%3D%270.35%200%200%200%200%20%200%200.297%200%200%200%20%200%200%200.245%200%200%20%200%200%200%200.3%200%27/%3E%0A%20%20%3C/filter%3E%0A%20%20%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%20fill%3D%27rgb%2880%2C70%2C55%29%27/%3E%0A%3C/svg%3E");
        --font-hand: "Caveat", "Cormorant Garamond", serif;
        --font-serif: var(--font-hand);
        --font-mono: "Cutive Mono", "Caveat", monospace;
        --font-sans: var(--font-hand);
      }

      /* Dark mode overrides when .dark-mode is present on body */
      body.dark-mode {
        /* Warm, botanical dark palette */
        --bg: #0b1117; /* inked night */
        --paper: #111923; /* slightly lighter card surface */
        --accent: #b8925a; /* brass */
        --muted: #9aa7b2; /* muted steel */
        --text: #e7eef5; /* soft off-white for primary copy */
        --text-muted: #9aa7b2;
        --btn-bg-top: rgba(18, 24, 32, 0.7);
        --btn-bg-bottom: rgba(12, 18, 26, 0.7);
        --btn-text: #e7eef5;
        --btn-primary-top: #1a2634;
        --btn-primary-bottom: #121b26;
        --btn-primary-text: #e7eef5;
        --youtube-bg-top: rgba(18, 24, 32, 0.7);
        --youtube-bg-bottom: rgba(12, 18, 26, 0.7);
        --card-shadow: 0 20px 48px rgba(0, 0, 0, 0.6);
        --card-shadow-drop: drop-shadow(0 20px 44px rgba(0, 0, 0, 0.6));
        --card-border: rgba(255, 255, 255, 0.04);
        --grain-opacity: 0.35;
        --ink-wash-1: rgba(100, 130, 160, 0.08);
        --ink-wash-2: rgba(184, 146, 90, 0.08);
        --ink-wash-3: rgba(80, 120, 160, 0.06);
        --ink-line: rgba(230, 238, 245, 0.18);
        --fiber-1: rgba(230, 238, 245, 0.08);
        --fiber-2: rgba(255, 255, 255, 0.05);
        --paper-edge: rgba(255, 255, 255, 0.12);
        --paper-speckle: rgba(230, 238, 245, 0.28);
        --paper-fiber: rgba(200, 210, 220, 0.24);
        --paper-band: rgba(230, 238, 245, 0.14);
        --paper-texture: url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27160%27%20height%3D%27160%27%3E%0A%20%20%3Cfilter%20id%3D%27n%27%3E%0A%20%20%20%20%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.9%27%20numOctaves%3D%272%27%20seed%3D%277%27/%3E%0A%20%20%20%20%3CfeColorMatrix%20type%3D%27matrix%27%20values%3D%270.5%200%200%200%200%20%200%200.425%200%200%200%20%200%200%200.350%200%200%20%200%200%200%200.25%200%27/%3E%0A%20%20%3C/filter%3E%0A%20%20%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27%20fill%3D%27rgb%28230%2C238%2C245%29%27/%3E%0A%3C/svg%3E");
        color: var(--text);
      }

      /* Smooth transitions for theme changes */
      body,
      .widget,
      .container,
      .youtube-wrapper {
        transition: background 280ms ease, color 280ms ease,
          box-shadow 280ms ease, border-color 280ms ease;
      }

      /* Dark mode: soften youtube wrapper background so iframe edges don't feel harsh */
      body.dark-mode .youtube-wrapper {
        background: linear-gradient(
          180deg,
          rgba(18, 28, 20, 0.6),
          rgba(12, 18, 14, 0.6)
        );
      }
      /* include padding in element sizing to avoid accidental overflow */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        font-family: var(--font-serif);
        margin: 0;
        padding: 28px;
        /* use paper as the gradient end so dark-mode keeps a dark gradient */
        background: radial-gradient(
            1200px 800px at 6% -10%,
            var(--ink-wash-1),
            transparent 60%
          ),
          radial-gradient(
            900px 700px at 94% -5%,
            var(--ink-wash-2),
            transparent 60%
          ),
          radial-gradient(
            1000px 800px at 40% 115%,
            var(--ink-wash-3),
            transparent 60%
          ),
          linear-gradient(180deg, var(--bg) 0%, var(--paper) 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .container {
        max-width: 1200px;
        width: 100%;
        display: grid;
        /* responsive: fit as many columns as will at a comfortable minimum width */
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        grid-auto-rows: auto;
        gap: 26px;
        padding: 12px;
        position: relative;
      }
      .container::before,
      .container::after {
        content: none;
      }
      @media (max-width: 1100px) {
        body {
          padding: 16px;
          align-items: stretch;
          justify-content: flex-start;
        }
        .container {
          max-width: 720px;
          grid-template-columns: 1fr;
          gap: 16px;
          padding: 4px;
        }
        .container::before,
        .container::after {
          display: none;
        }
        .margin-note,
        .ink-ornament {
          display: none;
        }
        .widget {
          padding: 18px 18px 16px 18px;
          border-radius: 10px;
        }
        @supports (clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%)) {
          .widget,
          .container .widget:nth-child(2),
          .container .widget:nth-child(3),
          .container .widget:nth-child(4) {
            clip-path: none;
            filter: none;
            box-shadow: var(--card-shadow);
            border-radius: 10px;
          }
        }
        .clock-display {
          font-size: 4rem;
        }
        .weather-temp {
          font-size: 4rem;
        }
        .weather-desc {
          font-size: 1.4rem;
        }
        .greeting {
          font-size: 1.05rem;
          top: 14px;
          left: 16px;
        }
        .settings-cog {
          top: 12px;
          right: 12px;
          width: 32px;
          height: 32px;
        }
        .quote-rotator {
          display: none;
        }
        .widget.youtube {
          display: block;
        }
        .youtube-wrapper {
          display: none;
        }
        .youtube-compact {
          display: flex;
        }
        .work-delta {
          font-size: 1rem;
        }
        .work-totals {
          font-size: 0.85rem;
        }
        .work-mode-toggle .mode-btn {
          font-size: 0.86rem;
          padding: 5px 12px;
        }
      }
      /* subtle paper grain overlay */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(
          rgba(0, 0, 0, 0.015) 0.5px,
          transparent 0.6px
        );
        background-size: 6px 6px;
        opacity: var(--grain-opacity);
        mix-blend-mode: multiply;
      }
      body::after {
        content: "";
        position: fixed;
        inset: -10%;
        pointer-events: none;
        background: radial-gradient(
            320px 240px at 12% 18%,
            var(--ink-wash-1),
            transparent 62%
          ),
          radial-gradient(
            420px 300px at 86% 22%,
            var(--ink-wash-2),
            transparent 64%
          ),
          radial-gradient(
            280px 220px at 70% 78%,
            var(--ink-wash-3),
            transparent 60%
          );
        opacity: 0.9;
        filter: blur(4px);
        mix-blend-mode: multiply;
        animation: ink-drift 22s ease-in-out infinite alternate;
      }
      @keyframes ink-drift {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
          opacity: 0.85;
        }
        50% {
          transform: translate3d(-1.5%, 1%, 0) scale(1.02);
          opacity: 0.95;
        }
        100% {
          transform: translate3d(1.5%, -1%, 0) scale(1.01);
          opacity: 0.9;
        }
      }
      @keyframes widget-reveal {
        from {
          opacity: 0;
          filter: blur(6px);
        }
        to {
          opacity: 1;
          filter: blur(0);
        }
      }
      @keyframes ink-glow {
        0%,
        100% {
          text-shadow: 0 0 0 rgba(0, 0, 0, 0);
        }
        50% {
          text-shadow: 0 3px 10px rgba(30, 36, 48, 0.08);
        }
      }
      @keyframes ink-line {
        0%,
        100% {
          transform: scaleX(0.6);
        }
        50% {
          transform: scaleX(1);
        }
      }
      @keyframes ink-bloom {
        0% {
          transform: translate3d(0, 0, 0) scale(0.98);
          opacity: 0.12;
        }
        50% {
          transform: translate3d(2%, -2%, 0) scale(1.02);
          opacity: 0.18;
        }
        100% {
          transform: translate3d(-2%, 1%, 0) scale(1);
          opacity: 0.14;
        }
      }
      .widget {
        border-radius: 14px 12px 16px 10px;
        padding: 28px 26px 24px 26px;
        box-shadow: var(--card-shadow);
        border: 1px solid var(--paper-edge);
        /* CSS variables drive the 3D tilt transform: --rx/--ry in deg, --tz in px, --scale */
        --rx: 0deg;
        --ry: 0deg;
        --tz: 0px;
        --scale: 1;
        background: var(--paper);
        background-image: linear-gradient(var(--paper), var(--paper)),
          repeating-linear-gradient(
            0deg,
            transparent 0 18px,
            var(--paper-band) 18px 20px
          ),
          repeating-linear-gradient(
            90deg,
            transparent 0 10px,
            var(--fiber-1) 10px 11px
          ),
          repeating-linear-gradient(
            0deg,
            transparent 0 12px,
            var(--fiber-2) 12px 13px
          ),
          radial-gradient(
            var(--paper-speckle) 1px,
            transparent 1.5px
          ),
          repeating-linear-gradient(
            140deg,
            transparent 0 6px,
            var(--paper-fiber) 6px 7px
          ),
          var(--paper-texture);
        background-blend-mode: normal, multiply, multiply, screen, multiply, multiply, multiply;
        background-size: auto, auto, auto, auto, 9px 9px, auto, 160px 160px;
        position: relative;
        overflow: hidden;
        transform: perspective(800px) translateZ(var(--tz)) rotateX(var(--rx))
          rotateY(var(--ry)) scale(var(--scale));
        transition: transform 220ms cubic-bezier(0.2, 0.9, 0.2, 1),
          box-shadow 220ms cubic-bezier(0.2, 0.9, 0.2, 1);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

        .widget {

          border-radius: 0;
          box-shadow: none;
          filter: var(--card-shadow-drop);
        }
        .container .widget:nth-child(2) {
          clip-path: var(--torn-2);
        }
        .container .widget:nth-child(3) {
          clip-path: var(--torn-3);

        }
      }
      .widget.has-margin-note {
        padding-top: 50px;
      }
      .widget > * {
        position: relative;
        z-index: 2;
      }
      .handwritten {
        font-family: var(--font-hand);
        letter-spacing: 0.02em;
        font-weight: 500;
      }
      .margin-note {
        position: absolute;
        left: 18px;
        top: 14px;
        font-family: var(--font-hand);
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        opacity: 0.7;
        pointer-events: none;
        z-index: 3;
        transform: rotate(-1.2deg);
      }
      .margin-note.alt {
        transform: rotate(1.1deg);
      }
      .margin-note::after {
        content: "";
        position: absolute;
        left: 0;
        top: 100%;
        margin-top: 6px;
        width: 46px;
        height: 1px;
        background: linear-gradient(
          90deg,
          var(--accent),
          transparent 80%
        );
        opacity: 0.35;
      }
      .ink-ornament {
        position: absolute;
        width: 190px;
        height: 160px;
        pointer-events: none;
        opacity: 0.16;
        mix-blend-mode: multiply;
        filter: blur(0.3px);
        animation: ink-bloom 16s ease-in-out infinite;
        z-index: 0;
      }
      .ink-ornament.ink-1 {
        top: -48px;
        right: -36px;
        background: radial-gradient(
            45% 55% at 60% 40%,
            rgba(30, 36, 48, 0.35),
            transparent 70%
          ),
          radial-gradient(
            40% 50% at 30% 30%,
            rgba(138, 106, 59, 0.25),
            transparent 72%
          ),
          radial-gradient(
            50% 60% at 50% 70%,
            rgba(20, 28, 36, 0.22),
            transparent 75%
          );
      }
      .ink-ornament.ink-2 {
        bottom: -50px;
        left: -30px;
        width: 210px;
        height: 180px;
        animation-delay: 1.5s;
        background: radial-gradient(
            50% 60% at 40% 40%,
            rgba(20, 28, 36, 0.28),
            transparent 72%
          ),
          radial-gradient(
            40% 50% at 70% 60%,
            rgba(138, 106, 59, 0.22),
            transparent 72%
          );
      }
      .ink-ornament.ink-3 {
        top: 14px;
        left: -20px;
        width: 140px;
        height: 120px;
        animation-delay: 0.6s;
        background: radial-gradient(
            50% 60% at 45% 45%,
            rgba(30, 36, 48, 0.22),
            transparent 70%
          ),
          radial-gradient(
            40% 50% at 65% 65%,
            rgba(138, 106, 59, 0.18),
            transparent 72%
          );
      }
      .doodle {
        position: absolute;
        width: 96px;
        height: 10px;
        bottom: 14px;
        right: 16px;
        background: repeating-linear-gradient(
          90deg,
          rgba(30, 36, 48, 0.3) 0 4px,
          transparent 4px 7px
        );
        opacity: 0.22;
        transform: rotate(-2deg);
        mix-blend-mode: multiply;
        pointer-events: none;
        z-index: 1;
      }
      .doodle.left {
        left: 16px;
        right: auto;
        transform: rotate(2deg);
      }
      body.dark-mode .doodle {
        background: repeating-linear-gradient(
          90deg,
          rgba(230, 238, 245, 0.35) 0 4px,
          transparent 4px 7px
        );
        opacity: 0.25;
        mix-blend-mode: screen;
      }
      body.dark-mode .ink-ornament {
        opacity: 0.22;
        mix-blend-mode: screen;
      }
      .widget::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--sheen),
          repeating-linear-gradient(
            135deg,
            rgba(0, 0, 0, 0.06) 0 2px,
            transparent 2px 6px
          );
        opacity: 0.85;
        pointer-events: none;
        mix-blend-mode: soft-light;
        z-index: 1;
      }
      .widget::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        box-shadow: inset 0 0 0 1px var(--paper-edge),
          inset 0 -12px 18px rgba(20, 24, 30, 0.06);
        pointer-events: none;
        opacity: 0.45;
        z-index: 1;
      }
      @media (prefers-reduced-motion: no-preference) {
        .widget {
          animation: widget-reveal 900ms ease both;
        }
        .widget:nth-child(1) {
          animation-delay: 80ms;
        }
        .widget:nth-child(2) {
          animation-delay: 180ms;
        }
        .widget:nth-child(3) {
          animation-delay: 280ms;
        }
        .widget:nth-child(4) {
          animation-delay: 380ms;
        }
        .clock-display {
          animation: ink-glow 6s ease-in-out infinite;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        body::after {

      /* Mobile: keep header and footer static and allow the tiles area to scroll */
      @media (max-width: 768px) {
        /* Mobile header/footer heights (used to position the scrollable middle area) */
        :root {
          --mobile-header-h: 64px;
          --mobile-footer-h: 84px;
        }

        /* Create simple mobile header and footer wrappers to host fixed elements */
        .mobile-header,
        .mobile-footer {
          display: none;
        }
        .mobile-header {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          height: var(--mobile-header-h);
          z-index: 1600;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 8px 12px;
          background: var(--paper);
          box-shadow: 0 6px 18px rgba(8, 12, 8, 0.06);
        }
        .mobile-footer {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          height: var(--mobile-footer-h);
          z-index: 1600;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 8px 12px;
          background: var(--paper);
          box-shadow: 0 -6px 18px rgba(8, 12, 8, 0.06);
        }

        /* show mobile header/footer and hide the desktop absolute elements */
        .mobile-header,
        .mobile-footer {
          display: flex;
        }
        /* hide desktop-positioned duplicates so they don't overlap */
        body > .greeting,
        body > .settings-cog,
        body > .quote-rotator {
          display: none !important;
        }
        /* make the elements inside the mobile wrappers interactive */
        .mobile-header .greeting,
        .mobile-header .settings-cog,
        .mobile-footer .quote-rotator {
          pointer-events: auto;
        }

        /* Side padding retained on body, but the central area will be the scrollable region */
        body {
          padding: 0 8px;
        }

        /* Make the central page area fill remaining height and be scrollable between header/footer */
        .page-blur-root {
          position: fixed;
          top: var(--mobile-header-h);
          left: 0;
          right: 0;
          bottom: var(--mobile-footer-h);
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
          z-index: 100;
        }
        .page-blur-root .blur-overlay {
          position: absolute;
        }
        /* container sits centered inside the scroll area and has extra bottom padding so content isn't obscured by the fixed footer */
        .page-blur-root .container {
          padding: 16px;
          box-sizing: border-box;
          width: 100%;
          margin: 0 auto;
          padding-bottom: calc(var(--mobile-footer-h) + 24px);
        }
      }
      /* quote text displayed at the bottom of the page content, aligned right */
      .quote-rotator {
        display: block;
        /* margin: 18px 20px 48px auto; right-aligned with a 20px gap from the edge */
        position: absolute;
        bottom: 28px;
        right: 28px;
        max-height: 75px;
        max-width: 360px;
        padding: 0;
        font-family: var(--font-hand);
        color: var(--text);
        opacity: 0.98;
        transition: transform 0.12s ease, opacity 0.12s ease;
        background: transparent;
        border: none;
        box-shadow: none;
        text-align: right; /* ensure author aligns neatly */
      }
      .quote-rotator .quote {
        font-size: 0.95rem;
        line-height: 1.3;
        opacity: 0;
        transition: opacity 600ms ease,
          transform 600ms cubic-bezier(0.2, 0.9, 0.2, 1);
        transform: translateY(6px);
        background: transparent;
        padding: 0;
        margin: 0;
      }
      .quote-rotator .quote.active {
        opacity: 1;
        transform: translateY(0);
      }
      .quote-rotator .author {
        font-size: 0.82rem;
        margin-top: 6px;
        color: var(--accent);
        opacity: 0.7;
        font-family: var(--font-hand);
      }
      .quote-rotator:hover {
        transform: translateY(-2px);
      }
      /* Hover-to-blur: when hovering a tile, blur everything except the hovered tile */
      body.tile-focused::before {
        /* increase overlay darkness slightly when a tile is focused to help readability */
        background-color: rgba(255, 255, 255, 0);
      }
      /* page blur implemented with an overlay using backdrop-filter so the active widget can sit above it */
      .page-blur-root {
        position: relative;
      }
      .page-blur-root .blur-overlay {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.02);
        -webkit-backdrop-filter: blur(6px) saturate(0.98);
        backdrop-filter: blur(6px) saturate(0.98);
        opacity: 0;
        pointer-events: none; /* overlay never captures pointer events */
        transition: opacity 220ms ease;
        z-index: 1000;
      }
      /* when active, show the overlay (it intercepts pointer events so blurred content isn't interactive) */
      body.tile-focused .page-blur-root .blur-overlay {
        opacity: 1;
        pointer-events: auto;
      }
      /* Make the container non-interactive while blur is active; allow the active widget to remain interactive */
      body.tile-focused .page-blur-root .container {
        pointer-events: none;
      }
      /* Exempt the active widget by placing it above the overlay */
      body.tile-focused .page-blur-root .widget.is-active {

      }
    </style>
  </head>
  <body>

              allowfullscreen

    <!-- Mobile footer wrapper (mirrors quote-rotator) -->
    <div class="mobile-footer" aria-hidden="true">
      <div class="quote-rotator" id="quote-rotator" aria-live="polite">
        <div class="quote" id="quote-content">

    </div>
    <script>
      // Hover/focus blur logic: when a widget is hovered or focused, blur the rest of the page
      (function () {
        var body = document.body;
        var widgets = Array.prototype.slice.call(
          document.querySelectorAll(".widget")
        );
        if (!widgets.length) return;

        function clearActive() {
          body.classList.remove("tile-focused");
          widgets.forEach(function (x) {
            x.classList.remove("is-active");
          });
        }

        function setActive(w) {
          if (!w) return clearActive();
          body.classList.add("tile-focused");
          widgets.forEach(function (x) {
            x.classList.remove("is-active");
          });
          w.classList.add("is-active");
        }

        var reduceMotionQuery =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)");
        var prefersReducedMotion = reduceMotionQuery
          ? reduceMotionQuery.matches
          : false;
        if (reduceMotionQuery && reduceMotionQuery.addEventListener) {
          reduceMotionQuery.addEventListener("change", function (e) {
            prefersReducedMotion = e.matches;
          });
        } else if (reduceMotionQuery && reduceMotionQuery.addListener) {
          reduceMotionQuery.addListener(function (e) {
            prefersReducedMotion = e.matches;
          });
        }

        var rafId = null;
        var MAX_TILT = 12;

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function applyTransform(el, c, wigX, wigY) {
          wigX = wigX || 0;
          wigY = wigY || 0;
          var transform =
            "perspective(800px) translate3d(" +
            wigX +
            "px," +
            wigY +
            "px," +
            c.tz +
            "px) rotateX(" +
            c.rx +
            "deg) rotateY(" +
            c.ry +
            "deg) scale(" +
            c.scale +
            ")";
          el.style.transform = transform;
        }

        function updateTargetFromPointer(w) {
          var t = w._tilt;
          if (!t || !t.hasPending) return;
          if (t.rectDirty || !t.rect) {
            t.rect = w.getBoundingClientRect();
            t.rectDirty = false;
          }
          var rect = t.rect;
          var px = (t.pendingX - rect.left) / rect.width;
          var py = (t.pendingY - rect.top) / rect.height;
          var dx = (px - 0.5) * 2;
          var dy = (py - 0.5) * 2;
          var rx = -dy * MAX_TILT;
          var ry = dx * MAX_TILT;
          var tz = Math.max(
            6,
            Math.min(18, (1 - (Math.abs(dx) + Math.abs(dy)) / 2) * 18)
          );
          t.target.rx = rx;
          t.target.ry = ry;
          t.target.tz = tz;
          t.target.scale = 1.02;
          t.hasPending = false;
        }

        function ensureRaf() {
          if (!rafId) rafId = requestAnimationFrame(tickAll);
        }

        function tickAll(now) {
          rafId = null;
          var anyActive = false;
          var wiggleEnabledGlobal =
            !document.body.classList.contains("wiggle-disabled") &&
            !prefersReducedMotion;
          var nowSec = now / 1000;

          widgets.forEach(function (w) {
            var t = w._tilt;
            if (!t) return;
            var tiltEnabled = !document.body.classList.contains("tilt-disabled");
            var isActive = w.classList.contains("is-active") && tiltEnabled;

            if (isActive) updateTargetFromPointer(w);
            else t.hasPending = false;

            var cur = t.current;
            var tar = t.target;
            var near =
              Math.abs(cur.rx - tar.rx) < 0.05 &&
              Math.abs(cur.ry - tar.ry) < 0.05 &&
              Math.abs(cur.tz - tar.tz) < 0.5 &&
              Math.abs(cur.scale - tar.scale) < 0.005;

            if (near && !isActive && !wiggleEnabledGlobal) {
              if (t._hadTransform) {
                w.style.transform = "";
                t._hadTransform = false;
              }
              return;
            }

            var smooth = 0.16;
            cur.rx = lerp(cur.rx, tar.rx, smooth);
            cur.ry = lerp(cur.ry, tar.ry, smooth);
            cur.tz = lerp(cur.tz, tar.tz, 0.12);
            cur.scale = lerp(cur.scale, tar.scale, 0.08);

            var wigX = 0,
              wigY = 0;
            if (wiggleEnabledGlobal) {
              var s = w._wiggle;
              var phase = s.phase + nowSec * s.speed;
              var inten =
                typeof window._wiggleIntensity === "number"
                  ? window._wiggleIntensity
                  : 1.0;
              wigX = Math.sin(phase) * s.ampX * inten;
              wigY = Math.cos(phase * 0.92) * s.ampY * inten;
            }

            applyTransform(w, cur, wigX, wigY);
            t._hadTransform = true;
            anyActive = true;
          });

          if (anyActive) rafId = requestAnimationFrame(tickAll);
        }

        function markAllRectsDirty() {
          widgets.forEach(function (w) {
            if (w._tilt) w._tilt.rectDirty = true;
          });
        }

        window.addEventListener("resize", markAllRectsDirty, { passive: true });
        window.addEventListener("scroll", markAllRectsDirty, { passive: true });
        var scrollArea = document.querySelector(".page-blur-root");
        if (scrollArea)
          scrollArea.addEventListener("scroll", markAllRectsDirty, {
            passive: true,
          });

        widgets.forEach(function (w) {
          // per-widget tilt state
          w._tilt = {
            target: { rx: 0, ry: 0, tz: 0, scale: 1 },
            current: { rx: 0, ry: 0, tz: 0, scale: 1 },
            raf: null,
            rect: null,
            rectDirty: true,
            pendingX: 0,
            pendingY: 0,
            hasPending: false,
            _hadTransform: false,
          };

          // per-widget wiggle state (autonomous subtle motion)
          w._wiggle = {
            phase: Math.random() * Math.PI * 2,
            ampX: 0.5 + Math.random() * 0.9, // px horizontal
            ampY: 0.6 + Math.random() * 1.0, // px vertical
            speed: 0.45 + Math.random() * 0.6, // speed factor
          };

          // global intensity (1.0 default) applied multiplicatively to wiggle amps
          window._wiggleIntensity = window._wiggleIntensity || 1.0;

          // expose start helper so external callers (like settings) can start the RAF loop
          w._tilt.start = ensureRaf;

          // pointer handlers
          w.addEventListener("pointerenter", function () {
            setActive(w);
            w._tilt.rectDirty = true;
            if (!document.body.classList.contains("tilt-disabled")) ensureRaf();
          });
          w.addEventListener("pointerleave", function () {
            w._tilt.target = { rx: 0, ry: 0, tz: 0, scale: 1 };
            clearActive();
          });
          w.addEventListener(
            "pointermove",
            function (e) {
              if (!w.classList.contains("is-active")) return;
              if (document.body.classList.contains("tilt-disabled")) return;
              w._tilt.pendingX = e.clientX;
              w._tilt.pendingY = e.clientY;
              w._tilt.hasPending = true;
              ensureRaf();
            },
            { passive: true }
          );

          // keyboard accessibility
          if (!w.hasAttribute("tabindex")) w.setAttribute("tabindex", "0");
          w.addEventListener("focus", function () {
            setActive(w);
            w._tilt.rectDirty = true;
            if (!document.body.classList.contains("tilt-disabled")) ensureRaf();
          });
          w.addEventListener("blur", function () {
            w._tilt.target = { rx: 0, ry: 0, tz: 0, scale: 1 };
            clearActive();
          });
          w.addEventListener("pointercancel", function () {
            w._tilt.target = { rx: 0, ry: 0, tz: 0, scale: 1 };
            clearActive();
          });
        });

        // expose helper to start wiggle loops for all widgets (used when enabling wiggle in settings)
        window._cardControls = window._cardControls || {};
        window._cardControls.startAllWiggles = function () {
          widgets.forEach(function (w) {
            try {
              if (w && w._tilt && typeof w._tilt.start === "function")
                w._tilt.start();
            } catch (e) {}
          });
        };

        // Also remove the class if the user clicks outside any widget (safety)
        document.addEventListener(
          "pointerdown",
          function (e) {
            if (!e.target.closest || !e.target.closest(".widget")) clearActive();
          },
          { passive: true }
        );
      })();
      // Clock
      function getWeekNumber(date) {
        const d = new Date(
          Date.UTC(date.getFullYear(), date.getMonth(), date.getDate())
        );
        const dayNum = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
      }

      let previousDigits = ["0", "0", ":", "0", "0", ":", "0", "0"];
      let firstUpdate = true;
      let lastDateKey = null;
      let lastGreetingPrefix = null;

      const digitIds = [
        "h1",
        "h2",
        "colon1",
        "m1",
        "m2",
        "colon2",
        "s1",
        "s2",
      ];
      const digitElements = digitIds.map((id) => document.getElementById(id));
      const digitStates = new Map();
      const dateEl = document.getElementById("date");
      const greetingEl = document.getElementById("greeting");
      const nameSpan = document.getElementById("greeting-name");

      function initDigit(el) {
        if (!el || !el.classList.contains("digit")) return;
        const current = document.createElement("span");
        current.className = "digit-layer digit-current";
        current.textContent = el.textContent || "0";
        const next = document.createElement("span");
        next.className = "digit-layer digit-next";
        next.textContent = current.textContent;
        el.textContent = "";
        el.appendChild(current);
        el.appendChild(next);
        const state = { current, next, pending: null };
        digitStates.set(el, state);
        el.addEventListener("transitionend", (e) => {
          if (e.target !== current) return;
          if (!el.classList.contains("is-animating")) return;
          if (state.pending === null) return;
          state.current.textContent = state.pending;
          state.next.textContent = state.pending;
          state.pending = null;
          el.classList.remove("is-animating");
        });
      }

      digitElements.forEach(initDigit);

      function updateClock() {
        const now = new Date();
        // Build guaranteed 2-digit hour/minute/second components
        const hh = String(now.getHours()).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        const ss = String(now.getSeconds()).padStart(2, "0");
        const newDigits = [hh[0], hh[1], ":", mm[0], mm[1], ":", ss[0], ss[1]];

        const dateKey =
          now.getFullYear() + "-" + now.getMonth() + "-" + now.getDate();
        if (dateKey !== lastDateKey && dateEl) {
          const date = now.toLocaleDateString("en-US", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric",
          });
          const weekNum = getWeekNumber(now);
          dateEl.textContent = `${date} - Week ${weekNum}`;
          lastDateKey = dateKey;
        }

        // Update greeting prefix but preserve the editable name span
        const hour = now.getHours();
        let prefix = "Good ";
        if (hour < 6) prefix += "night";
        else if (hour < 12) prefix += "morning";
        else if (hour < 18) prefix += "afternoon";
        else if (hour < 22) prefix += "evening";
        else prefix += "night";
        // find greeting container and update only the prefix text node
        if (greetingEl) {
          // If the first child is a text node containing the prefix, update it; otherwise reconstruct safely
          const first = greetingEl.firstChild;
          const desired = `${prefix}, `;
          if (desired !== lastGreetingPrefix) {
            if (first && first.nodeType === Node.TEXT_NODE)
              first.textContent = desired;
            else {
              // clear and re-append
              greetingEl.innerHTML = "";
              greetingEl.appendChild(document.createTextNode(desired));
              if (nameSpan) greetingEl.appendChild(nameSpan);
            }
            lastGreetingPrefix = desired;
          }
        }

        // Animate changing digits (fixed sequencing: old slides up, then new slides in from below)
        for (let i = 0; i < newDigits.length; i++) {
          const digitElement = digitElements[i];
          if (!digitElement) continue;
          const state = digitStates.get(digitElement);
          if (!state || !digitElement.classList.contains("digit")) {
            digitElement.textContent = newDigits[i];
            continue;
          }
          if (newDigits[i] !== previousDigits[i] && !firstUpdate) {
            state.next.textContent = newDigits[i];
            state.pending = newDigits[i];
            digitElement.classList.add("is-animating");
          } else {
            state.current.textContent = newDigits[i];
            state.next.textContent = newDigits[i];
            state.pending = null;
            digitElement.classList.remove("is-animating");
          }
        }
        previousDigits = [...newDigits];
        firstUpdate = false;
      }
      setInterval(updateClock, 1000);
      updateClock();

      // Work Tracker Timer
      let timerInterval = null;
      let deepSeconds = 0;
      let shallowSeconds = 0;
      let activeMode = "deep";
      let lastTickMs = null;
      let isRunning = false;
      let targetSeconds = 7 * 3600 + 30 * 60;

      const LS_WORK_TARGET = "work_target_seconds";
      const LS_WORK_DEEP = "work_deep_seconds";
      const LS_WORK_SHALLOW = "work_shallow_seconds";
      const LS_WORK_MODE = "work_mode";
      const LS_WORK_ELAPSED = "work_elapsed_seconds";
      const LS_WORK_RUNNING = "work_is_running";
      const LS_WORK_LAST_START = "work_last_start_ms";
      const elapsedEl = document.getElementById("work-elapsed");
      const deltaEl = document.getElementById("work-delta");
      const targetEl = document.getElementById("work-target");
      const deepTotalEl = document.getElementById("work-deep-total");
      const shallowTotalEl = document.getElementById("work-shallow-total");
      const modeToggleEl = document.getElementById("work-mode-toggle");
      const saveStatusEl = document.getElementById("work-save-status");
      const toggleBtn = document.getElementById("toggle");
      const toggleIcon = document.getElementById("toggle-icon");
      const resetBtn = document.getElementById("reset");

      function formatHMS(totalSeconds) {
        const s = Math.max(0, Math.floor(totalSeconds));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        return `${String(h).padStart(2, "0")}:${String(m).padStart(
          2,
          "0"
        )}:${String(sec).padStart(2, "0")}`;
      }

      function formatHM(totalSeconds) {
        const s = Math.max(0, Math.floor(totalSeconds));
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        return `${h}:${String(m).padStart(2, "0")}`;
      }

      function parseTargetToSeconds(text) {
        if (!text) return null;
        const t = text.trim().toLowerCase();
        if (!t) return null;
        if (t.includes(":")) {
          const parts = t.split(":");
          const h = parseInt(parts[0].replace(/[^0-9]/g, ""), 10);
          const m = parseInt(parts[1].replace(/[^0-9]/g, ""), 10);
          const s =
            parts.length > 2
              ? parseInt(parts[2].replace(/[^0-9]/g, ""), 10)
              : 0;
          if (isNaN(h) || isNaN(m) || isNaN(s)) return null;
          return h * 3600 + m * 60 + s;
        }
        let hours = 0;
        let minutes = 0;
        let seconds = 0;
        let matched = false;
        const hMatch = t.match(/(\d+(?:\.\d+)?)\s*h/);
        if (hMatch) {
          hours = parseFloat(hMatch[1]);
          matched = true;
        }
        const mMatch = t.match(/(\d+(?:\.\d+)?)\s*m/);
        if (mMatch) {
          minutes = parseFloat(mMatch[1]);
          matched = true;
        }
        const sMatch = t.match(/(\d+(?:\.\d+)?)\s*s/);
        if (sMatch) {
          seconds = parseFloat(sMatch[1]);
          matched = true;
        }
        if (matched)
          return Math.round(hours * 3600 + minutes * 60 + seconds);
        const num = parseFloat(t.replace(/[^0-9.]/g, ""));
        if (!isNaN(num)) return Math.round(num * 3600);
        return null;
      }

      function getActiveSeconds() {
        return activeMode === "deep" ? deepSeconds : shallowSeconds;
      }

      function updateDelta() {
        if (!deltaEl) return;
        const diff = targetSeconds - deepSeconds;
        if (diff >= 0) deltaEl.textContent = `Deep remaining ${formatHMS(diff)}`;
        else deltaEl.textContent = `Deep over ${formatHMS(-diff)}`;
      }

      function showSaveStatus(text, isError) {
        if (!saveStatusEl) return;
        saveStatusEl.textContent = text;
        saveStatusEl.classList.toggle("is-error", !!isError);
      }

      function persistState(showStatus) {
        try {
          localStorage.setItem(LS_WORK_DEEP, String(deepSeconds));
          localStorage.setItem(LS_WORK_SHALLOW, String(shallowSeconds));
          localStorage.setItem(LS_WORK_MODE, activeMode);
          localStorage.setItem(LS_WORK_RUNNING, isRunning ? "true" : "false");
          if (isRunning && lastTickMs !== null) {
            localStorage.setItem(LS_WORK_LAST_START, String(lastTickMs));
          } else {
            localStorage.removeItem(LS_WORK_LAST_START);
          }
          if (showStatus) {
            showSaveStatus(
              "Saved " +
                new Date().toLocaleTimeString([], {
                  hour: "2-digit",
                  minute: "2-digit",
                  second: "2-digit",
                })
            );
          }
        } catch (e) {
          if (showStatus) showSaveStatus("Storage unavailable", true);
        }
      }

      function updateModeUI() {
        if (!modeToggleEl) return;
        modeToggleEl.dataset.mode = activeMode;
        const buttons = modeToggleEl.querySelectorAll(".mode-btn");
        buttons.forEach((btn) => {
          const isActive = btn.dataset.mode === activeMode;
          btn.classList.toggle("is-active", isActive);
          btn.setAttribute("aria-pressed", isActive ? "true" : "false");
        });
      }

      function updateElapsedDisplay() {
        if (elapsedEl) elapsedEl.textContent = formatHMS(getActiveSeconds());
        if (deepTotalEl) deepTotalEl.textContent = `Deep ${formatHMS(deepSeconds)}`;
        if (shallowTotalEl)
          shallowTotalEl.textContent = `Shallow ${formatHMS(shallowSeconds)}`;
        updateDelta();
      }

      function tick() {
        const now = Date.now();
        if (lastTickMs === null) {
          lastTickMs = now;
          return;
        }
        const diff = Math.floor((now - lastTickMs) / 1000);
        if (diff > 0) {
          if (activeMode === "deep") deepSeconds += diff;
          else shallowSeconds += diff;
          lastTickMs += diff * 1000;
          updateElapsedDisplay();
          persistState(false);
        }
      }

      function startTimer() {
        if (isRunning) return;
        isRunning = true;
        lastTickMs = Date.now();
        timerInterval = setInterval(tick, 250);
        updateToggleIcon();
        persistState(true);
      }

      function pauseTimer() {
        if (!isRunning) return;
        isRunning = false;
        clearInterval(timerInterval);
        timerInterval = null;
        lastTickMs = null;
        updateToggleIcon();
        persistState(true);
      }

      function resetTimer() {
        pauseTimer();
        deepSeconds = 0;
        shallowSeconds = 0;
        updateElapsedDisplay();
        persistState(true);
      }

      function updateToggleIcon() {
        if (isRunning) toggleIcon.className = "fa-solid fa-pause";
        else toggleIcon.className = "fa-solid fa-play";
      }

      function applyTargetFromInput() {
        if (!targetEl) return;
        const parsed = parseTargetToSeconds(targetEl.textContent || "");
        if (parsed !== null && parsed >= 0) {
          targetSeconds = parsed;
          try {
            localStorage.setItem(LS_WORK_TARGET, String(targetSeconds));
            showSaveStatus("Saved target");
          } catch (e) {
            showSaveStatus("Storage unavailable", true);
          }
          targetEl.textContent = formatHM(targetSeconds);
          updateDelta();
        } else {
          targetEl.textContent = formatHM(targetSeconds);
        }
      }

      function restoreWorkState() {
        try {
          const savedDeep = parseInt(localStorage.getItem(LS_WORK_DEEP) || "", 10);
          const savedShallow = parseInt(
            localStorage.getItem(LS_WORK_SHALLOW) || "",
            10
          );
          if (!isNaN(savedDeep) && savedDeep >= 0) deepSeconds = savedDeep;
          if (!isNaN(savedShallow) && savedShallow >= 0)
            shallowSeconds = savedShallow;
          if (isNaN(savedDeep) && isNaN(savedShallow)) {
            const legacyElapsed = parseInt(
              localStorage.getItem(LS_WORK_ELAPSED) || "",
              10
            );
            if (!isNaN(legacyElapsed) && legacyElapsed >= 0)
              deepSeconds = legacyElapsed;
          }
          const savedMode = localStorage.getItem(LS_WORK_MODE);
          if (savedMode === "deep" || savedMode === "shallow")
            activeMode = savedMode;
          const savedRunning =
            localStorage.getItem(LS_WORK_RUNNING) === "true";
          const lastStartMs = parseInt(
            localStorage.getItem(LS_WORK_LAST_START) || "",
            10
          );
          if (savedRunning) {
            if (!isNaN(lastStartMs) && lastStartMs > 0) {
              const diff = Math.floor((Date.now() - lastStartMs) / 1000);
              if (diff > 0) {
                if (activeMode === "deep") deepSeconds += diff;
                else shallowSeconds += diff;
              }
            }
            isRunning = false;
            startTimer();
          } else {
            updateToggleIcon();
          }
          updateModeUI();
          updateElapsedDisplay();
          showSaveStatus("Restored");
        } catch (e) {
          showSaveStatus("Storage unavailable", true);
        }
      }

      if (targetEl) {
        const savedTarget = parseInt(
          localStorage.getItem(LS_WORK_TARGET) || "",
          10
        );
        if (!isNaN(savedTarget) && savedTarget >= 0) {
          targetSeconds = savedTarget;
        }
        targetEl.textContent = formatHM(targetSeconds);

        targetEl.addEventListener("focus", () => {
          document.execCommand("selectAll", false, null);
        });
        targetEl.addEventListener("keydown", (e) => {
          const allowed = [
            "Backspace",
            "Delete",
            "ArrowLeft",
            "ArrowRight",
            "ArrowUp",
            "ArrowDown",
            "Enter",
            "Tab",
            ":",
            "h",
            "m",
            "s",
            "H",
            "M",
            "S",
            ".",
            " ",
          ];
          if (e.key === "Enter") {
            e.preventDefault();
            targetEl.blur();
            return;
          }
          if (allowed.includes(e.key)) return;
          if (/^[0-9]$/.test(e.key)) return;
          e.preventDefault();
        });
        targetEl.addEventListener("blur", applyTargetFromInput);
      }

      toggleBtn.addEventListener("click", () => {
        if (isRunning) pauseTimer();
        else startTimer();
      });
      resetBtn.addEventListener("click", resetTimer);
      if (modeToggleEl) {
        modeToggleEl.addEventListener("click", (e) => {
          const btn = e.target.closest(".mode-btn");
          if (!btn) return;
          const mode = btn.dataset.mode;
          if (mode !== "deep" && mode !== "shallow") return;
          if (mode === activeMode) return;
          if (isRunning) {
            tick();
            lastTickMs = Date.now();
          }
          activeMode = mode;
          updateModeUI();
          updateElapsedDisplay();
          persistState(true);
        });
      }
      restoreWorkState();
      window.addEventListener("beforeunload", () => persistState(false));

      // Weather
      async function fetchWeather() {
        try {
          // Using wttr.in for weather data (no API key required)
          const response = await fetch("https://wttr.in/?format=j1");
          const data = await response.json();
          const current = data.current_condition[0];
          const temp = current.temp_C;
          const desc = current.weatherDesc[0].value;

          document.querySelector(".weather-temp").textContent = `${temp}°C`;
          document.querySelector(".weather-desc").textContent = desc;
        } catch (error) {
          document.querySelector(".weather-desc").textContent =
            "Unable to fetch weather";
          console.error("Weather fetch error:", error);
        }
      }
      fetchWeather();
      setInterval(fetchWeather, 600000); // Update every 10 minutes

      // YouTube Player - You can change the playlist ID to your preferred ambient music
      // For now, using a placeholder. Replace with actual ambient music playlist
      // Example: https://www.youtube.com/embed/videoseries?list=PLAYLIST_ID
    </script>
    <script>
      // Settings: YouTube preference persisted in localStorage
      (function () {
        const COG = document.getElementById("settings-cog");
        const BACKDROP = document.getElementById("settings-backdrop");
        const SAVE = document.getElementById("settings-save");
        const CANCEL = document.getElementById("settings-cancel");
        const RESET = document.getElementById("settings-reset");
        const INPUT = document.getElementById("youtube-url");
        const SHOW_SECONDS = document.getElementById("show-seconds");
        const ENABLE_TILT = document.getElementById("enable-tilt");
        const IFRAME = document.getElementById("youtube-iframe");
        const CLOCK = document.getElementById("clock");
        const LS_KEY = "preferred_youtube_id";
        const LS_KEY_SHOW = "show_seconds";
        const LS_KEY_TILT = "ui_enable_tilt";
        const LS_KEY_WIGGLE = "ui_enable_wiggle";
        const LS_KEY_WIGGLE_INTENSITY = "ui_wiggle_intensity";
        const LS_KEY_THEME = "ui_theme_mode";
        var mediaPref =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)");

        function applyTheme(mode) {
          // mode: 'system'|'light'|'dark'
          if (mode === "system") {
            var isDark = mediaPref ? mediaPref.matches : false;
            if (isDark) document.body.classList.add("dark-mode");
            else document.body.classList.remove("dark-mode");
          } else if (mode === "dark") {
            document.body.classList.add("dark-mode");
          } else {
            document.body.classList.remove("dark-mode");
          }
        }

        function onSystemPrefChange(e) {
          var chosen = localStorage.getItem(LS_KEY_THEME) || "system";
          if (chosen === "system") applyTheme("system");
        }

        function parseYouTubeId(input) {
          if (!input) return null;
          input = input.trim();
          // if looks like an ID (11+ chars alnum-_)
          const idMatch = input.match(/[A-Za-z0-9_-]{11,}/);
          if (idMatch) return idMatch[0];
          return null;
        }

        function buildYouTubeUrl(id) {
          const origin = encodeURIComponent(window.location.origin);
          return `https://www.youtube.com/embed/${id}?rel=0&enablejsapi=1&playsinline=1&origin=${origin}`;
        }

        function setIframeById(id) {
          if (!id) return;
          IFRAME.src = buildYouTubeUrl(id);
          if (window._ytCompact && typeof window._ytCompact.setVideoId === "function")
            window._ytCompact.setVideoId(id);
        }

        function applyShowSeconds(shouldShow) {
          if (!CLOCK) return;
          if (shouldShow) CLOCK.classList.remove("no-seconds");
          else CLOCK.classList.add("no-seconds");
        }

        function openSettings() {
          const saved = localStorage.getItem(LS_KEY);
          const savedShow = localStorage.getItem(LS_KEY_SHOW);
          INPUT.value = saved || IFRAME.dataset.defaultId || "";
          // default: show seconds (true) when no preference set
          const show = savedShow === null ? true : savedShow === "true";
          SHOW_SECONDS.checked = show;
          const tiltSaved = localStorage.getItem(LS_KEY_TILT);
          const tiltOn = tiltSaved === null ? true : tiltSaved === "true";
          ENABLE_TILT.checked = tiltOn;
          const wigSaved = localStorage.getItem(LS_KEY_WIGGLE);
          const wigOn = wigSaved === null ? true : wigSaved === "true";
          var ENABLE_WIGGLE = document.getElementById("enable-wiggle");
          if (ENABLE_WIGGLE) ENABLE_WIGGLE.checked = wigOn;
          var INTENSITY = document.getElementById("enable-wiggle-intensity");
          const savedIntensity =
            localStorage.getItem(LS_KEY_WIGGLE_INTENSITY) || "medium";
          if (INTENSITY) INTENSITY.value = savedIntensity;
          BACKDROP.style.display = "flex";
          BACKDROP.setAttribute("aria-hidden", "false");
          // focus the input for convenience
          INPUT.focus();
        }

        function closeSettings() {
          BACKDROP.style.display = "none";
          BACKDROP.setAttribute("aria-hidden", "true");
        }

        COG.addEventListener("click", openSettings);
        CANCEL.addEventListener("click", closeSettings);
        BACKDROP.addEventListener("click", (e) => {
          if (e.target === BACKDROP) closeSettings();
        });

        SAVE.addEventListener("click", () => {
          // persist show-seconds regardless of the YouTube input
          const showVal = !!SHOW_SECONDS.checked;
          localStorage.setItem(LS_KEY_SHOW, showVal ? "true" : "false");
          applyShowSeconds(showVal);
          // persist tilt preference
          const tiltVal = !!ENABLE_TILT.checked;
          localStorage.setItem(LS_KEY_TILT, tiltVal ? "true" : "false");
          if (tiltVal) document.body.classList.remove("tilt-disabled");
          else document.body.classList.add("tilt-disabled");

          // persist wiggle preference
          var ENABLE_WIGGLE_SAVE = document.getElementById("enable-wiggle");
          var wigVal = ENABLE_WIGGLE_SAVE ? !!ENABLE_WIGGLE_SAVE.checked : true;
          localStorage.setItem(LS_KEY_WIGGLE, wigVal ? "true" : "false");
          if (wigVal) {
            document.body.classList.remove("wiggle-disabled");
            // start wiggle loops gently
            // save intensity selection too
            var INTENSITY_SAVE = document.getElementById(
              "enable-wiggle-intensity"
            );
            var intensityVal = INTENSITY_SAVE ? INTENSITY_SAVE.value : "medium";
            localStorage.setItem(LS_KEY_WIGGLE_INTENSITY, intensityVal);
            // map intensity to multiplier
            var map = { low: 0.6, medium: 1.0, high: 1.6 };
            window._wiggleIntensity = map[intensityVal] || 1.0;
            if (
              window._cardControls &&
              typeof window._cardControls.startAllWiggles === "function"
            )
              window._cardControls.startAllWiggles();
          } else document.body.classList.add("wiggle-disabled");

          // persist theme choice
          var THEME = document.getElementById("theme-mode");
          var themeVal = THEME ? THEME.value : "system";
          localStorage.setItem(LS_KEY_THEME, themeVal);
          applyTheme(themeVal);

          // YouTube id is optional here; only save/apply if provided
          const raw = (INPUT.value || "").trim();
          if (raw === "") {
            closeSettings();
            return;
          }
          const id = parseYouTubeId(raw);
          if (!id) {
            alert("Please paste a valid YouTube URL or ID.");
            return;
          }
          localStorage.setItem(LS_KEY, id);
          setIframeById(id);
          closeSettings();
        });

        RESET.addEventListener("click", () => {
          const defaultId = IFRAME.dataset.defaultId;
          localStorage.removeItem(LS_KEY);
          localStorage.removeItem(LS_KEY_SHOW);
          setIframeById(defaultId);
          INPUT.value = defaultId || "";
          // reset seconds to default (show)
          SHOW_SECONDS.checked = true;
          applyShowSeconds(true);
          // reset tilt to default (enabled)
          ENABLE_TILT.checked = true;
          localStorage.removeItem(LS_KEY_TILT);
          document.body.classList.remove("tilt-disabled");
          // reset wiggle to default (enabled)
          var ENABLE_WIGGLE_RST = document.getElementById("enable-wiggle");
          if (ENABLE_WIGGLE_RST) ENABLE_WIGGLE_RST.checked = true;
          localStorage.removeItem(LS_KEY_WIGGLE);
          document.body.classList.remove("wiggle-disabled");
          // reset intensity to medium
          localStorage.removeItem(LS_KEY_WIGGLE_INTENSITY);
          var INTENSITY_RST = document.getElementById(
            "enable-wiggle-intensity"
          );
          if (INTENSITY_RST) INTENSITY_RST.value = "medium";
          window._wiggleIntensity = 1.0;
          // reset theme to system
          localStorage.removeItem(LS_KEY_THEME);
          var THEME_RST = document.getElementById("theme-mode");
          if (THEME_RST) THEME_RST.value = "system";
          applyTheme("system");
        });

        // on load, apply saved id and show-seconds preference if present
        const saved = localStorage.getItem(LS_KEY);
        if (saved) setIframeById(saved);
        const savedShow = localStorage.getItem(LS_KEY_SHOW);
        const show = savedShow === null ? true : savedShow === "true";
        applyShowSeconds(show);
        // apply tilt preference
        const tiltSaved = localStorage.getItem(LS_KEY_TILT);
        const tiltOn = tiltSaved === null ? true : tiltSaved === "true";
        if (!tiltOn) document.body.classList.add("tilt-disabled");
        // apply wiggle preference
        const wigSaved = localStorage.getItem(LS_KEY_WIGGLE);
        const wigOn = wigSaved === null ? true : wigSaved === "true";
        if (!wigOn) document.body.classList.add("wiggle-disabled");
        else {
          // start wiggle loops after a short defer so widgets exist
          // load intensity and map to multiplier
          const savedIntensity =
            localStorage.getItem(LS_KEY_WIGGLE_INTENSITY) || "medium";
          var map = { low: 0.6, medium: 1.0, high: 1.6 };
          window._wiggleIntensity = map[savedIntensity] || 1.0;
          setTimeout(function () {
            if (
              window._cardControls &&
              typeof window._cardControls.startAllWiggles === "function"
            )
              window._cardControls.startAllWiggles();
          }, 80);
        }
        // apply theme preference
        const themeSaved = localStorage.getItem(LS_KEY_THEME) || "system";
        var themeSel = document.getElementById("theme-mode");
        if (themeSel) themeSel.value = themeSaved;
        applyTheme(themeSaved);
        // listen to system changes if available
        if (mediaPref && mediaPref.addEventListener)
          mediaPref.addEventListener("change", onSystemPrefChange);
        else if (mediaPref && mediaPref.addListener)
          mediaPref.addListener(onSystemPrefChange);
      })();
    </script>
    <script>
      // YouTube compact bar controller
      (function () {
        const IFRAME = document.getElementById("youtube-iframe");
        const toggleBtn = document.getElementById("yt-toggle");
        const toggleIcon = document.getElementById("yt-toggle-icon");
        const titleEl = document.getElementById("yt-title");
        const currentEl = document.getElementById("yt-current");
        const totalEl = document.getElementById("yt-total");
        const progressEl = document.getElementById("yt-progress");
        if (!IFRAME) return;

        let player = null;
        let ready = false;
        let tickTimer = null;

        function fmtTime(sec) {
          const s = Math.max(0, Math.floor(sec || 0));
          const h = Math.floor(s / 3600);
          const m = Math.floor((s % 3600) / 60);
          const ss = s % 60;
          if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
          return `${m}:${String(ss).padStart(2, "0")}`;
        }

        function setTitle(text) {
          if (titleEl) titleEl.textContent = text || "Untitled";
        }

        function updateToggleIcon(isPlaying) {
          if (!toggleIcon) return;
          toggleIcon.className = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";
        }

        function updateProgress() {
          if (!player || !ready) return;
          const duration = player.getDuration ? player.getDuration() : 0;
          const current = player.getCurrentTime ? player.getCurrentTime() : 0;
          if (currentEl) currentEl.textContent = fmtTime(current);
          if (totalEl) totalEl.textContent = fmtTime(duration);
          if (progressEl && duration > 0) {
            const pct = Math.max(0, Math.min(100, (current / duration) * 100));
            progressEl.style.width = pct.toFixed(2) + "%";
          }
        }

        function startTick() {
          if (tickTimer) return;
          tickTimer = setInterval(updateProgress, 500);
        }

        function stopTick() {
          if (tickTimer) {
            clearInterval(tickTimer);
            tickTimer = null;
          }
        }

        function onPlayerReady() {
          ready = true;
          const data = player.getVideoData ? player.getVideoData() : null;
          if (data && data.title) setTitle(data.title);
          updateProgress();
        }

        function onPlayerStateChange(e) {
          if (!e || typeof e.data !== "number") return;
          const YTState = window.YT ? window.YT.PlayerState : null;
          const playing = YTState ? e.data === YTState.PLAYING : e.data === 1;
          updateToggleIcon(playing);
          if (playing) startTick();
          else stopTick();
          if (player && player.getVideoData) {
            const data = player.getVideoData();
            if (data && data.title) setTitle(data.title);
          }
        }

        function initPlayer() {
          if (!window.YT || !window.YT.Player) return;
          player = new window.YT.Player("youtube-iframe", {
            events: {
              onReady: onPlayerReady,
              onStateChange: onPlayerStateChange,
            },
          });
        }

        window._ytCompact = {
          setVideoId: function (id) {
            if (!id) return;
            if (player && player.cueVideoById) {
              player.cueVideoById(id);
              const data = player.getVideoData ? player.getVideoData() : null;
              if (data && data.title) setTitle(data.title);
            }
          },
        };

        if (toggleBtn) {
          toggleBtn.addEventListener("click", () => {
            if (!player || !ready) return;
            const state = player.getPlayerState ? player.getPlayerState() : -1;
            if (state === 1) player.pauseVideo();
            else player.playVideo();
          });
        }

        if (!window.YT || !window.YT.Player) {
          const tag = document.createElement("script");
          tag.src = "https://www.youtube.com/iframe_api";
          document.head.appendChild(tag);
        }
        const prev = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = function () {
          if (typeof prev === "function") prev();
          initPlayer();
        };
      })();
    </script>

        function render(i) {
          const q = QUOTES[i];
          // fade out
          content.classList.remove("active");
          setTimeout(() => {
            textEl.textContent = q.text;
            authorEl.textContent = "— " + q.author;
            // fade in
            content.classList.add("active");
          }, 250);
        }

        function next() {
          render(randomIndex());
        }

        function start() {
          stop();
          timer = setInterval(next, ROTATE_MS);
        }

        function stop() {
          if (timer) {
            clearInterval(timer);
            timer = null;
          }
        }

        // initial render
        render(idx);

        // Greeting name persistence: load stored name and wire up inline editing save
        (function () {
          const NAME_KEY = "greeting_name";
          const nameSpan = document.getElementById("greeting-name");
          if (!nameSpan) return;
          // Initialize from storage if present
          const stored = localStorage.getItem(NAME_KEY);
          if (stored !== null && stored.trim() !== "")
            nameSpan.textContent = stored;

          // Save helper
          function saveName() {
            const val = (nameSpan.textContent || "").trim();
            if (val === "") return; // don't save empty names
            localStorage.setItem(NAME_KEY, val);
          }

          // Blur saves
          nameSpan.addEventListener("blur", () => saveName());
          // Enter saves and blurs (prevent newline)
          nameSpan.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              nameSpan.blur();
            }
          });
        })();
        start();

        container.addEventListener("mouseenter", stop);
        container.addEventListener("mouseleave", start);
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) stop();
          else start();
        });

        // expose for debugging if needed
        window._quoteRotator = { start, stop, next, render };
      })();
    </script>
    <!-- sprite walker canvas -->
    <canvas
      id="sprite-canvas"
      style="
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 140px;
        pointer-events: none;
        z-index: 999;
      "
      aria-hidden="true"
    ></canvas>
    <script src="./sprite-walker.js"></script>
  </body>
</html>
